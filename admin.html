<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - ETF 매수 타이밍</title>
    <style>
        :root {
            --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
            --text: #f1f5f9; --text2: #cbd5e1; --muted: #94a3b8;
            --accent: #38bdf8; --green: #22c55e; --yellow: #f59e0b;
            --red: #ef4444; --border: rgba(148,163,184,0.15);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); padding:16px; min-height:100vh; }
        .wrap { max-width:520px; margin:0 auto; }
        .login-box { background:var(--bg2); border-radius:16px; padding:32px; border:1px solid var(--border); text-align:center; margin-top:80px; }
        .login-box h2 { font-size:1.2rem; color:var(--accent); margin-bottom:6px; }
        .login-box p { font-size:0.72rem; color:var(--muted); margin-bottom:24px; }
        .lock-icon { font-size:2.5rem; margin-bottom:16px; }
        input, select { width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; font-size:0.82rem; outline:none; transition:border 0.2s; }
        input:focus, select:focus { border-color:var(--accent); }
        input::placeholder { color:var(--muted); }
        label { display:block; font-size:0.7rem; color:var(--muted); margin-bottom:4px; margin-top:12px; }
        .btn { padding:10px 20px; border-radius:8px; font-size:0.78rem; font-weight:700; cursor:pointer; border:none; transition:all 0.2s; width:100%; margin-top:12px; }
        .btn-primary { background:var(--accent); color:#0f172a; }
        .btn-primary:hover { opacity:0.85; }
        .btn-danger { background:#ef444422; color:var(--red); border:1px solid #ef444444; }
        .btn-danger:hover { background:#ef444433; }
        .btn-success { background:#22c55e22; color:var(--green); border:1px solid #22c55e44; }
        .btn-success:hover { background:#22c55e33; }
        .btn-warning { background:#f59e0b22; color:var(--yellow); border:1px solid #f59e0b44; }
        .btn-warning:hover { background:#f59e0b33; }
        .btn-sm { width:auto; padding:6px 12px; font-size:0.7rem; margin-top:0; }
        .section { background:var(--bg2); border-radius:12px; padding:16px; border:1px solid var(--border); margin-bottom:12px; }
        .section-title { font-size:0.85rem; font-weight:800; color:var(--accent); margin-bottom:14px; }
        .admin-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:16px; }
        .admin-header h1 { font-size:1rem; color:var(--accent); font-weight:800; }
        .logout-btn { background:var(--bg3); border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:20px; font-size:0.65rem; cursor:pointer; }
        .ticker-item { background:var(--bg); border-radius:8px; margin-bottom:8px; border:1px solid var(--border); overflow:hidden; }
        .ticker-header { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; }
        .ticker-info { display:flex; flex-direction:column; gap:3px; flex:1; }
        .ticker-actions { display:flex; gap:6px; flex-shrink:0; }
        .ticker-edit { padding:12px; border-top:1px solid var(--border); background:var(--bg2); display:none; }
        .ticker-edit.open { display:block; }
        .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .criteria-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 20px; font-size:0.75rem; opacity:0; transition:all 0.3s; pointer-events:none; z-index:999; white-space:nowrap; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.success { border-color:#22c55e44; color:var(--green); }
        .toast.error { border-color:#ef444444; color:var(--red); }
        .tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--bg2); padding:4px; border-radius:10px; }
        .tab { flex:1; padding:8px; text-align:center; font-size:0.72rem; font-weight:600; border-radius:7px; cursor:pointer; color:var(--muted); transition:all 0.2s; }
        .tab.active { background:var(--accent); color:#0f172a; }
        .back-link { font-size:0.65rem; color:var(--muted); text-decoration:none; }
        .back-link:hover { color:var(--accent); }
        .status-on { background:#22c55e22; color:var(--green); border:1px solid #22c55e44; padding:2px 6px; border-radius:6px; font-size:0.6rem; font-weight:700; }
        .status-off { background:#ef444422; color:var(--red); border:1px solid #ef444444; padding:2px 6px; border-radius:6px; font-size:0.6rem; font-weight:700; }
        .status-watch { background:#f59e0b22; color:var(--yellow); border:1px solid #f59e0b44; padding:2px 6px; border-radius:6px; font-size:0.6rem; font-weight:700; }
        .tag { padding:2px 7px; border-radius:10px; font-size:0.6rem; font-weight:600; background:var(--bg3); color:var(--muted); }
        .info-box { font-size:0.65rem; color:var(--muted); padding:8px; background:var(--bg); border-radius:6px; border-left:2px solid var(--accent); margin-bottom:8px; }
        .loading { text-align:center; color:var(--muted); font-size:0.72rem; padding:20px; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }
        .fade-up { animation:fadeUp 0.4s ease both; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- 로그인 -->

        <div class="login-box fade-up">
            <div class="lock-icon">🔐</div>
            <h2>관리자 로그인</h2>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAdBYufBEjTgz5gw_p5tyse4BkJhAsEgNo",
    authDomain: "fngu-buy-signal.firebaseapp.com",
    databaseURL: "https://fngu-buy-signal-default-rtdb.firebaseio.com",
    projectId: "fngu-buy-signal",
    storageBucket: "fngu-buy-signal.firebasestorage.app",
    messagingSenderId: "1062337214387",
    appId: "1:1062337214387:web:b7a02ce6db68bf9252bdc6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== 로그인 - 완전 단순화 =====
window.doLogin = async function() {
    const pw = document.getElementById('pw-input').value.trim();
    const err = document.getElementById('login-error');
    const debug = document.getElementById('login-debug');
    err.style.display = 'none';
    debug.textContent = '확인 중...';

    try {
        // DB에서 비밀번호 읽기
        const snap = await get(ref(db, 'admin/password'));
        debug.textContent = `DB 읽기: ${snap.exists() ? '성공' : '비밀번호 없음'}`;

        let savedPw = 'parks1983!'; // 현재 DB에 저장된 값
        if (snap.exists()) {
            savedPw = snap.val();
        }

        debug.textContent = `입력: "${pw}" / 저장: "${savedPw}"`;

        if (pw === savedPw) {
            sessionStorage.setItem('admin_auth', 'true');
            sessionStorage.setItem('admin_pw', pw);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-screen').style.display = 'block';
            initAdmin();
        } else {
            err.style.display = 'block';
            document.getElementById('pw-input').value = '';
        }
    } catch(e) {
        debug.textContent = `에러: ${e.message}`;
        // DB 실패 시 하드코딩된 비밀번호로 시도
        if (pw === 'parks1983!' || pw === 'admin1234') {
            sessionStorage.setItem('admin_auth', 'true');
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-screen').style.display = 'block';
            initAdmin();
        } else {
            err.style.display = 'block';
            document.getElementById('pw-input').value = '';
        }
    }
};

window.doLogout = function() {
    sessionStorage.removeItem('admin_auth');
    sessionStorage.removeItem('admin_pw');
    location.reload();
};

if (sessionStorage.getItem('admin_auth') === 'true') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    initAdmin();
}

// ===== signal 재계산 =====
async function recalcSignal() {
    try {
        const [mSnap, tdSnap, crSnap, msgSnap] = await Promise.all([
            get(ref(db, 'market')),
            get(ref(db, 'tickers_data')),
            get(ref(db, 'criteria')),
            get(ref(db, 'messages'))
        ]);
        const m = mSnap.exists() ? mSnap.val() : {};
        const td = tdSnap.exists() ? tdSnap.val() : {};
        const cr = crSnap.exists() ? crSnap.val() : {fear:25,vix:30,sp500:-10,nasdaq:-15,fngu:-20,soxl:-20};
        const msg = msgSnap.exists() ? msgSnap.val() : {};

        const fearT=parseFloat(cr.fear||25), vixT=parseFloat(cr.vix||30);
        const spT=parseFloat(cr.sp500||-10), nqT=parseFloat(cr.nasdaq||-15);
        const fnguT=parseFloat(cr.fngu||-20), soxlT=parseFloat(cr.soxl||-20);

        const fearOk=(m.fear_greed||0)<=fearT?1:0;
        const vixOk=(m.vix||0)>=vixT?1:0;
        const spOk=(m.sp500_ytd||0)<=spT?1:0;
        const nqOk=(m.nasdaq_ytd||0)<=nqT?1:0;
        const fnguOk=(td['FNGU']?.ytd||0)<=fnguT?1:0;
        const soxlOk=(td['SOXL']?.ytd||0)<=soxlT?1:0;

        const total=fearOk+vixOk+spOk+nqOk+fnguOk+soxlOk;
        const pct=Math.round(total/6*100);

        let strategy, status;
        if(pct>=60){strategy=msg.strong||'강력 매수 시작';status='강력 매수 구간';}
        else if(pct>=30){strategy=msg.partial||'부분 매수 + 관망';status='부분 매수 구간';}
        else{strategy=msg.watch||'관망 유지';status='관망 구간';}

        await set(ref(db,'signal'),{
            signal_status:status, buy_readiness:pct, checks:total,
            total_conditions:6, strategy,
            check_results:{
                fear:{ok:fearOk,val:m.fear_greed||0,label:`공포지수 ${fearT}↓`},
                vix:{ok:vixOk,val:m.vix||0,label:`VIX ${vixT}↑`},
                sp500:{ok:spOk,val:m.sp500_ytd||0,label:`S&P ${spT}%↓`},
                nasdaq:{ok:nqOk,val:m.nasdaq_ytd||0,label:`NASDAQ ${nqT}%↓`},
                fngu:{ok:fnguOk,val:td['FNGU']?.ytd||0,label:`FNGU ${fnguT}%↓`},
                soxl:{ok:soxlOk,val:td['SOXL']?.ytd||0,label:`SOXL ${soxlT}%↓`},
            },
            ticker_checks:{}
        });
        return pct;
    } catch(e) { console.error(e); return null; }
}

// ===== 가격 조회 =====
async function fetchStockPrice(symbol) {
    const urls = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=ytd`)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query2.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=ytd`)}`
    ];
    for (const url of urls) {
        try {
            const res = await fetch(url);
            const data = await res.json();
            const result = data?.chart?.result?.[0];
            if (!result) continue;
            const closes = result.indicators?.quote?.[0]?.close?.filter(v => v != null);
            if (!closes || closes.length < 2) continue;
            const cur = Math.round(closes[closes.length-1]*100)/100;
            const prev = Math.round(closes[closes.length-2]*100)/100;
            const first = Math.round(closes[0]*100)/100;
            return {
                price: cur,
                change: Math.round((cur-prev)/prev*10000)/100,
                ytd: Math.round((cur-first)/first*10000)/100
            };
        } catch(e) { continue; }
    }
    return null;
}

function getTypeLabel(type) {
    return {leverage3x:'3X',leverage:'2X',etf:'ETF',stock:'주식'}[type] || type || 'ETF';
}

// ===== 탭 =====
window.switchTab = function(tab) {
    ['tickers','criteria','status'].forEach(t => {
        document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
    });
    document.querySelectorAll('.tab').forEach((el,i) => {
        el.className='tab'+(['tickers','criteria','status'][i]===tab?' active':'');
    });
    if(tab==='status') loadDBStatus();
    if(tab==='criteria') loadCriteria();
};

async function initAdmin() { await loadTickers(); await loadCriteria(); }

// ===== 종목 로드 =====
async function loadTickers() {
    const list = document.getElementById('ticker-list');
    try {
        const [tickerSnap, tdSnap] = await Promise.all([
            get(ref(db,'tickers')), get(ref(db,'tickers_data'))
        ]);
        if (!tickerSnap.exists()) {
            await set(ref(db,'tickers'),{
                FNGU:{name:'FNGU (FANG+ 3X)',type:'leverage3x',threshold:-20,status:'active',active:true},
                SOXL:{name:'SOXL (반도체 3X)',type:'leverage3x',threshold:-20,status:'active',active:true}
            });
            await loadTickers(); return;
        }
        const tickers = tickerSnap.val();
        const td = tdSnap.exists() ? tdSnap.val() : {};
        list.innerHTML = '';

        Object.entries(tickers).forEach(([symbol, info]) => {
            const price = td[symbol]?.price;
            const ytd = td[symbol]?.ytd;
            const div = document.createElement('div');
            div.className = 'ticker-item';
            div.innerHTML = `
                <div class="ticker-header">
                    <div class="ticker-info">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            <span style="font-size:0.82rem;font-weight:800;">${symbol}</span>
                            <span class="tag">${getTypeLabel(info.type)}</span>
                            <span class="${info.status==='active'?'status-on':info.status==='watch'?'status-watch':'status-off'}">
                                ${info.status==='active'?'활성':info.status==='watch'?'관심':'비활성'}
                            </span>
                        </div>
                        <span style="font-size:0.65rem;font-weight:700;color:${ytd>=0?'var(--green)':'var(--red)'};">
                            ${price?`$${price} (${ytd}%)`:'가격 없음'}
                        </span>
                        <span style="font-size:0.62rem;color:var(--muted);">${info.name} · 기준: ${info.threshold||-20}%↓</span>
                    </div>
                    <div class="ticker-actions">
                        <button class="btn btn-sm btn-warning" onclick="toggleEdit('${symbol}')">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTicker('${symbol}')">삭제</button>
                    </div>
                </div>
                <div class="ticker-edit" id="edit-${symbol}">
                    <div style="font-size:0.72rem;font-weight:700;color:var(--accent);margin-bottom:10px;">✏️ ${symbol} 수정</div>
                    <div class="edit-grid">
                        <div style="grid-column:1/-1;">
                            <label>종목 이름</label>
                            <input type="text" id="ename-${symbol}" value="${info.name||''}"/>
                        </div>
                        <div>
                            <label>종류</label>
                            <select id="etype-${symbol}">
                                <option value="stock" ${info.type==='stock'?'selected':''}>개별 주식</option>
                                <option value="etf" ${info.type==='etf'?'selected':''}>일반 ETF</option>
                                <option value="leverage" ${info.type==='leverage'?'selected':''}>레버리지 2X</option>
                                <option value="leverage3x" ${info.type==='leverage3x'?'selected':''}>레버리지 3X</option>
                            </select>
                        </div>
                        <div>
                            <label>매수 기준 (%)</label>
                            <input type="number" id="ethreshold-${symbol}" value="${info.threshold||-20}" step="1"/>
                        </div>
                        <div>
                            <label>상태</label>
                            <select id="estatus-${symbol}">
                                <option value="active" ${info.status==='active'?'selected':''}>활성</option>
                                <option value="watch" ${info.status==='watch'?'selected':''}>관심</option>
                                <option value="inactive" ${info.status==='inactive'?'selected':''}>비활성</option>
                            </select>
                        </div>
                        <div style="grid-column:1/-1;">
                            <button class="btn btn-warning" style="margin-top:4px;" onclick="refreshPrice('${symbol}')">🔄 가격 재조회</button>
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button class="btn btn-primary" style="flex:1;margin-top:0;" onclick="saveTicker('${symbol}')">💾 저장</button>
                        <button class="btn btn-danger" style="flex:1;margin-top:0;" onclick="toggleEdit('${symbol}')">취소</button>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
    } catch(e) {
        list.innerHTML = `<div style="color:var(--red);padding:12px;">${e.message}</div>`;
    }
}

window.toggleEdit = function(symbol) {
    document.getElementById(`edit-${symbol}`).classList.toggle('open');
};

window.saveTicker = async function(symbol) {
    const name = document.getElementById(`ename-${symbol}`).value.trim();
    const type = document.getElementById(`etype-${symbol}`).value;
    const threshold = parseFloat(document.getElementById(`ethreshold-${symbol}`).value)||-20;
    const status = document.getElementById(`estatus-${symbol}`).value;
    if (!name) { showToast('이름을 입력하세요','error'); return; }
    try {
        await update(ref(db,`tickers/${symbol}`),{name,type,threshold,status,active:status==='active'});
        const tdSnap = await get(ref(db,`tickers_data/${symbol}`));
        if (status==='inactive') {
            await remove(ref(db,`tickers_data/${symbol}`));
        } else if (tdSnap.exists()) {
            await update(ref(db,`tickers_data/${symbol}`),{name,type,threshold,status});
        } else {
            const p = await fetchStockPrice(symbol);
            if (p) await set(ref(db,`tickers_data/${symbol}`),{...p,name,type,threshold,status});
        }
        const r = await recalcSignal();
        showToast(`✅ ${symbol} 저장! 준비도 ${r}%`,'success');
        document.getElementById(`edit-${symbol}`).classList.remove('open');
        await loadTickers();
    } catch(e) { showToast('저장 실패: '+e.message,'error'); }
};

window.refreshPrice = async function(symbol) {
    showToast(`⏳ ${symbol} 가격 조회 중...`,'success');
    const p = await fetchStockPrice(symbol);
    if (!p) { showToast(`${symbol} 가격 조회 실패`,'error'); return; }
    const snap = await get(ref(db,`tickers/${symbol}`));
    const info = snap.val();
    await set(ref(db,`tickers_data/${symbol}`),{...p,name:info.name,type:info.type,threshold:info.threshold,status:info.status});
    await recalcSignal();
    showToast(`✅ $${p.price} (${p.ytd}% YTD) 업데이트됨`,'success');
    await loadTickers();
};

window.addTicker = async function() {
    const symbol = document.getElementById('new-symbol').value.trim().toUpperCase();
    const name = document.getElementById('new-name').value.trim();
    const type = document.getElementById('new-type').value;
    const threshold = parseFloat(document.getElementById('new-threshold').value)||-20;
    const status = document.getElementById('new-status').value||'active';
    if (!symbol||!name) { showToast('심볼과 이름을 입력하세요','error'); return; }
    try {
        showToast(`⏳ ${symbol} 추가 중...`,'success');
        await set(ref(db,`tickers/${symbol}`),{name,type,threshold,status,active:status==='active'});
        if (status!=='inactive') {
            const p = await fetchStockPrice(symbol);
            await set(ref(db,`tickers_data/${symbol}`),{
                price:p?.price||0, change:p?.change||0, ytd:p?.ytd||0,
                name,type,threshold,status
            });
        }
        const r = await recalcSignal();
        showToast(`✅ ${symbol} 추가! 준비도 ${r}%`,'success');
        document.getElementById('new-symbol').value='';
        document.getElementById('new-name').value='';
        document.getElementById('new-threshold').value='-20';
        await loadTickers();
    } catch(e) { showToast('추가 실패: '+e.message,'error'); }
};

window.deleteTicker = async function(symbol) {
    if (!confirm(`${symbol} 삭제하시겠습니까?`)) return;
    await remove(ref(db,`tickers/${symbol}`));
    await remove(ref(db,`tickers_data/${symbol}`));
    const r = await recalcSignal();
    showToast(`${symbol} 삭제 완료 → 준비도 ${r}%`,'success');
    await loadTickers();
};

async function loadCriteria() {
    try {
        const snap = await get(ref(db,'criteria'));
        if (snap.exists()) {
            const c=snap.val();
            document.getElementById('cr-fear').value=c.fear||25;
            document.getElementById('cr-vix').value=c.vix||30;
            document.getElementById('cr-sp').value=c.sp500||-10;
            document.getElementById('cr-nq').value=c.nasdaq||-15;
            document.getElementById('cr-fngu').value=c.fngu||-20;
            document.getElementById('cr-soxl').value=c.soxl||-20;
        }
        const ms = await get(ref(db,'messages'));
        if (ms.exists()) {
            const m=ms.val();
            document.getElementById('msg-watch').value=m.watch||'관망 유지';
            document.getElementById('msg-partial').value=m.partial||'부분 매수 + 관망';
            document.getElementById('msg-strong').value=m.strong||'강력 매수 시작';
        }
    } catch(e) {}
}

window.saveCriteria = async function() {
    try {
        await set(ref(db,'criteria'),{
            fear:parseFloat(document.getElementById('cr-fear').value)||25,
            vix:parseFloat(document.getElementById('cr-vix').value)||30,
            sp500:parseFloat(document.getElementById('cr-sp').value)||-10,
            nasdaq:parseFloat(document.getElementById('cr-nq').value)||-15,
            fngu:parseFloat(document.getElementById('cr-fngu').value)||-20,
            soxl:parseFloat(document.getElementById('cr-soxl').value)||-20,
        });
        const r=await recalcSignal();
        showToast(`✅ 기준값 저장! 준비도 ${r}%`,'success');
    } catch(e) { showToast('저장 실패','error'); }
};

window.saveMessages = async function() {
    try {
        await set(ref(db,'messages'),{
            watch:document.getElementById('msg-watch').value||'관망 유지',
            partial:document.getElementById('msg-partial').value||'부분 매수 + 관망',
            strong:document.getElementById('msg-strong').value||'강력 매수 시작',
        });
        await recalcSignal();
        showToast('✅ 메시지 저장!','success');
    } catch(e) { showToast('저장 실패','error'); }
};

window.changePassword = async function() {
    const newPw=document.getElementById('pw-new').value;
    const confirm=document.getElementById('pw-confirm').value;
    if (newPw.length<6) { showToast('6자 이상 입력하세요','error'); return; }
    if (newPw!==confirm) { showToast('비밀번호가 일치하지 않습니다','error'); return; }
    await set(ref(db,'admin/password'),newPw);
    showToast('✅ 비밀번호 변경 완료!','success');
    document.getElementById('pw-new').value='';
    document.getElementById('pw-confirm').value='';
};

window.loadDBStatus = async function() {
    const content=document.getElementById('db-status-content');
    try {
        const snap=await get(ref(db,'/'));
        if (!snap.exists()) { content.innerHTML='<div style="color:var(--red);">DB 없음</div>'; return; }
        const d=snap.val(), m=d.market||{}, td=d.tickers_data||{}, s=d.signal||{};
        document.getElementById('edit-fear').value=m.fear_greed||'';
        document.getElementById('edit-vix').value=m.vix||'';
        document.getElementById('edit-sp500').value=m.sp500||'';
        document.getElementById('edit-sp-ytd').value=m.sp500_ytd||'';
        document.getElementById('edit-nasdaq').value=m.nasdaq||'';
        document.getElementById('edit-nq-ytd').value=m.nasdaq_ytd||'';
        const rows=Object.entries(td).map(([sym,data])=>
            `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);">
                <span style="font-size:0.68rem;font-weight:700;">${sym} <span style="color:var(--muted);">(${getTypeLabel(data.type)})</span></span>
                <span style="font-size:0.65rem;color:${data.ytd>=0?'var(--green)':'var(--red)'};">$${data.price} (${data.ytd}%) · ${data.threshold}%↓</span>
            </div>`
        ).join('');
        content.innerHTML=`
            <div style="margin-bottom:10px;">
                <div style="font-size:0.65rem;color:var(--muted);margin-bottom:6px;">📊 활성 종목 (${Object.keys(td).length}개)</div>
                ${rows||'<div style="font-size:0.65rem;color:var(--muted);">없음</div>'}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                ${[['🕐 업데이트',m.last_updated||'-'],['😱 공포지수',`${m.fear_greed||'-'}`],
                   ['📉 VIX',m.vix||'-'],['📈 S&P500',`${(m.sp500||0).toLocaleString()}`],
                   ['💻 NASDAQ',`${(m.nasdaq||0).toLocaleString()}`],['🎯 준비도',`${s.buy_readiness||'-'}% (${s.checks||0}/6)`]
                ].map(([l,v])=>`<div style="background:var(--bg);border-radius:6px;padding:6px 8px;">
                    <div style="font-size:0.58rem;color:var(--muted);">${l}</div>
                    <div style="font-size:0.7rem;font-weight:700;margin-top:2px;">${v}</div>
                </div>`).join('')}
            </div>`;
    } catch(e) { content.innerHTML=`<div style="color:var(--red);">로드 실패: ${e.message}</div>`; }
};

window.saveManualData = async function() {
    try {
        const korea=new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        const fear=parseInt(document.getElementById('edit-fear').value)||0;
        let fs='중립';
        if(fear<=25)fs='극도의 공포'; else if(fear<=40)fs='공포'; else if(fear<=75)fs='탐욕'; else fs='극도의 탐욕';
        await update(ref(db,'market'),{
            fear_greed:fear, fear_greed_status:fs,
            vix:parseFloat(document.getElementById('edit-vix').value)||0,
            sp500:parseFloat(document.getElementById('edit-sp500').value)||0,
            sp500_ytd:parseFloat(document.getElementById('edit-sp-ytd').value)||0,
            nasdaq:parseInt(document.getElementById('edit-nasdaq').value)||0,
            nasdaq_ytd:parseFloat(document.getElementById('edit-nq-ytd').value)||0,
            last_updated:korea
        });
        const r=await recalcSignal();
        showToast(`✅ 수동 업데이트! 준비도 ${r}%`,'success');
        await loadDBStatus();
    } catch(e) { showToast('저장 실패: '+e.message,'error'); }
};

function showToast(msg,type='success') {
    const t=document.getElementById('toast');
    t.textContent=msg; t.className=`toast ${type} show`;
    setTimeout(()=>{ t.className='toast'; },3500);
}
window.showToast=showToast;
</script>
</body>
</html>
